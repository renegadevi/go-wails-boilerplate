# Name, description, and version live here.
# config.go and the frontend read the name, description, and version.
# A build copies these fields into the Windows manifest, version info, NSIS
# defines, Mac plists, and Linux package file. The binary name is APP_NAME
# in Taskfile.yml. The Mac minimum stays 14.0.0.
# `wails3 update build-assets` sets that minimum back to 12 and drops the
# AppStream entry from build/linux/nfpm/nfpm.yaml.
# scripts/write-linux-metainfo.py writes the metainfo from the fields below.
#
# MSIX packaging reads this file directly. build/windows/msix is not an input.
version: '3'

info:
  companyName: "Your Name"
  productName: "Boilerplate"
  productIdentifier: "com.wails.boilerplate"
  description: "Wails + Vue 3 + Go boilerplate."
  copyright: "Copyright"
  comments: "Copyright"
  version: "0.1.0"
  homepage: "https://github.com/renegadevi/go-wails-boilerplate"
  license: "MIT"

dev_mode:
  root_path: .
  # Wails file watcher. App logs are LOG_CONSOLE_LEVEL and LOG_FILE_LEVEL in .env.
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
